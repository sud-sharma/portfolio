<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sudhanshu Sharma — Software Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --bg: #F1EFEA;
    --surface: #FFFFFF;
    --text: #17191B;
    --text-muted: #5B5F63;
    --accent: #1D5B68;
    --accent-soft: #E1ECED;
    --accent-2: #A8551F;
    --accent-2-soft: #F3E6DA;
    --accent-3: #4C5FA0;
    --accent-3-soft: #E4E6F2;
    --border: #DAD6CC;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101315;
      --surface: #17191C;
      --text: #ECEDEE;
      --text-muted: #999FA5;
      --accent: #8FD0DE;
      --accent-soft: #182629;
      --accent-2: #E8935A;
      --accent-2-soft: #2B2018;
      --accent-3: #8E9EE0;
      --accent-3-soft: #1D2033;
      --border: #272B2F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101315;
    --surface: #17191C;
    --text: #ECEDEE;
    --text-muted: #999FA5;
    --accent: #8FD0DE;
    --accent-soft: #182629;
    --accent-2: #E8935A;
    --accent-2-soft: #2B2018;
    --accent-3: #8E9EE0;
    --accent-3-soft: #1D2033;
    --border: #272B2F;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  html, body { height: 100%; }
  ::selection { background: var(--accent); color: var(--surface); }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    max-width: 1180px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    align-self: start;
    height: 100vh;
    padding: 48px 28px 28px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid var(--border);
  }
  @media (max-width: 860px) {
    .sidebar {
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 24px 20px;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 13px; font-weight: 500;
    flex-shrink: 0;
  }
  .brand-text { line-height: 1.25; }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-role { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); }

  nav.desktop-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 40px; }
  @media (max-width: 860px) { nav.desktop-nav { display: none; } }
  nav.desktop-nav a {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-muted);
    text-decoration: none;
    padding: 9px 10px;
    border-left: 2px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: color .15s ease, border-color .15s ease;
  }
  nav.desktop-nav a svg { flex-shrink: 0; opacity: .8; }
  nav.desktop-nav a:hover, nav.desktop-nav a.active {
    color: var(--text);
    border-left-color: var(--accent);
  }
  nav.desktop-nav a.active svg { opacity: 1; color: var(--accent); }
  nav.desktop-nav a .idx { color: var(--accent); }

  .sidebar-footer { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 860px) { .sidebar-footer { display: none; } }
  .theme-toggle {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--text); }
  .sidebar-footer .loc { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }

  /* ---------- Main ---------- */
  main { padding: 0 28px 80px 40px; min-width: 0; }
  @media (max-width: 860px) { main { padding: 0 20px 60px; } }

  section { padding-top: 88px; scroll-margin-top: 24px; }
  section:first-of-type { padding-top: 56px; }
  @media (max-width: 860px) { section { padding-top: 64px; } }

  .section-id {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h2.section-title {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 32px;
    letter-spacing: -0.01em;
  }

  .section-divider { display: flex; align-items: center; gap: 14px; margin: 0 0 36px; }
  .section-divider .rule { flex: 1; height: 1px; background: var(--border); }
  .section-divider .mark {
    width: 7px; height: 7px;
    border: 1.5px solid var(--accent);
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .section-divider .mark.end { border-color: var(--border); }

  .icon-badge {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    border-radius: 7px;
  }
  .tone-a { color: var(--accent); }
  .tone-b { color: var(--accent-2); }
  .tone-c { color: var(--accent-3); }
  .tone-a .icon-badge, .icon-badge.tone-a { background: var(--accent-soft); border-color: transparent; }
  .tone-b .icon-badge, .icon-badge.tone-b { background: var(--accent-2-soft); border-color: transparent; }
  .tone-c .icon-badge, .icon-badge.tone-c { background: var(--accent-3-soft); border-color: transparent; }

  /* ---------- Hero ---------- */
  .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 28px; } }

  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 20px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .hero h1 {
    font-size: clamp(32px, 4.4vw, 46px);
    line-height: 1.08;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0 0 18px;
    max-width: 13ch;
  }
  .hero .tagline {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--accent);
    margin: 0 0 20px;
  }
  .hero p.summary {
    font-size: 16px;
    line-height: 1.65;
    color: var(--text-muted);
    max-width: 54ch;
    margin: 0 0 28px;
  }
  .hero-links { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    font-family: var(--mono);
    font-size: 12.5px;
    text-decoration: none;
    padding: 11px 18px;
    border: 1px solid var(--text);
    color: var(--text);
    background: transparent;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 6px;
  }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--surface); }

  .signal-wrap {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    padding: 18px 18px 14px;
  }
  .signal-wrap .signal-label {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .signal-path {
    stroke: var(--accent);
    stroke-width: 1.6;
    fill: none;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw 2.6s ease-out forwards .2s;
  }
  @media (prefers-reduced-motion: reduce) {
    .signal-path { animation: none; stroke-dashoffset: 0; }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- Experience (changelog style) ---------- */
  .timeline { border-left: 1px solid var(--border); margin-left: 4px; }
  .entry { position: relative; padding: 0 0 28px 28px; }
  .entry:last-child { padding-bottom: 4px; }
  .entry::before {
    content: '';
    position: absolute;
    left: -4.5px; top: 22px;
    width: 8px; height: 8px;
    background: var(--bg);
    border: 1.5px solid var(--accent);
    border-radius: 50%;
  }
  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 22px 24px;
  }
  .entry-card.tone-b { border-left-color: var(--accent-2); }
  .entry-card.tone-c { border-left-color: var(--accent-3); }
  .entry-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .entry .meta {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent-2);
    margin-bottom: 6px;
  }
  .entry h3 { font-size: 17px; margin: 0 0 2px; font-weight: 600; }
  .entry .org { font-size: 13.5px; color: var(--text-muted); margin: 0; }
  .entry ul { margin: 0; padding-left: 18px; }
  .entry li { font-size: 14.5px; line-height: 1.65; color: var(--text); margin-bottom: 6px; }
  .entry li::marker { color: var(--text-muted); }

  /* ---------- Projects ---------- */
  .flagship {
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    background: var(--surface);
    border-radius: 8px;
    padding: 32px;
    margin-bottom: 8px;
  }
  .flagship-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .flagship .flagship-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent-2);
    margin: 0;
  }
  .flagship h3 { margin: 0; font-size: 19px; font-weight: 600; }
  .flagship .stack { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-bottom: 16px; }
  .flagship p.desc { font-size: 14.5px; line-height: 1.65; color: var(--text-muted); max-width: 62ch; margin: 0 0 20px; }
  .flagship-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .flagship-grid { grid-template-columns: 1fr; } }
  .flagship ul { margin: 0; padding-left: 18px; }
  .flagship li { font-size: 14px; line-height: 1.65; color: var(--text); margin-bottom: 7px; }

  .diagram-wrap { border: 1px solid var(--border); border-radius: 6px; padding: 16px; background: var(--bg); }
  .diagram-wrap .diagram-caption {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); margin-top: 10px; text-align: center;
  }
  .flow-box {
    fill: var(--surface); stroke: var(--border); stroke-width: 1;
  }
  .flow-box.hot { stroke: var(--accent); }
  .flow-text { font-family: var(--mono); font-size: 9px; fill: var(--text); }
  .flow-text.muted { fill: var(--text-muted); font-size: 8px; }
  .flow-arrow { stroke: var(--text-muted); stroke-width: 1; marker-end: url(#arrowhead); fill: none; }

  .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; }
  @media (max-width: 700px) { .projects { grid-template-columns: 1fr; } }
  .project {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    padding: 22px;
  }
  .project-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .project h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .project .stack {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--accent);
    margin-top: 2px;
  }
  .project p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-muted); }
  .project ul { margin: 8px 0 0; padding-left: 18px; }
  .project li { font-size: 13.5px; line-height: 1.6; color: var(--text); margin-bottom: 4px; }

  /* ---------- Skills ---------- */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 600px) { .skills-grid { grid-template-columns: 1fr; } }
  .skill-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    padding: 18px;
  }
  .skill-card-head { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
  .skill-card .group-label {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text);
    font-weight: 500;
    margin: 0;
  }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-tags span {
    font-size: 12.5px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    background: var(--bg);
  }

  /* ---------- Education / Certs ---------- */
  .ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .ed-grid { grid-template-columns: 1fr; } }
  .ed-col .group-label {
    font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin: 0 0 14px;
  }
  .ed-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .ed-item:last-child { margin-bottom: 0; }
  .ed-item h4 { margin: 0 0 3px; font-size: 14.5px; font-weight: 600; }
  .ed-item .sub { font-size: 13px; color: var(--text-muted); }
  .ed-item .date { font-family: var(--mono); font-size: 11.5px; color: var(--accent-2); margin-top: 3px; }

  /* ---------- Contact / footer ---------- */
  .contact-block {
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    background: var(--surface);
    border-radius: 8px;
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .contact-block h2 { margin: 0; font-size: 24px; font-weight: 600; }
  .contact-block p { margin: 0; color: var(--text-muted); font-size: 14.5px; max-width: 46ch; }
  .contact-rows { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }

  footer.page-footer {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    padding: 32px 0 0;
    display: flex;
    justify-content: space-between;
  }
  @media (max-width: 500px) { footer.page-footer { flex-direction: column; gap: 6px; } }

  a { color: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const NAV = [
  { id: 'overview', label: 'Overview', idx: '00', icon: 'compass' },
  { id: 'experience', label: 'Experience', idx: '01', icon: 'briefcase' },
  { id: 'projects', label: 'Projects', idx: '02', icon: 'grid' },
  { id: 'skills', label: 'Skills', idx: '03', icon: 'zap' },
  { id: 'education', label: 'Education', idx: '04', icon: 'cap' },
  { id: 'contact', label: 'Contact', idx: '05', icon: 'mail' },
];

function useActiveSection() {
  const [active, setActive] = useState('overview');
  useEffect(() => {
    const sections = NAV.map(n => document.getElementById(n.id)).filter(Boolean);
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
      },
      { rootMargin: '-20% 0px -70% 0px' }
    );
    sections.forEach(s => obs.observe(s));
    return () => obs.disconnect();
  }, []);
  return active;
}

// Minimal hand-drawn line-icon set (no external icon library / no remote requests).
function Icon({ name, size = 18 }) {
  const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '1.7', strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (name) {
    case 'briefcase': return <svg {...p}><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M8,7 V5.5 A1.5,1.5 0 0 1 9.5,4 h5 A1.5,1.5 0 0 1 16,5.5 V7"/><line x1="3" y1="12.5" x2="21" y2="12.5"/></svg>;
    case 'code': return <svg {...p}><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/></svg>;
    case 'layers': return <svg {...p}><polygon points="12,3 21,8 12,13 3,8"/><polyline points="3,14 12,19 21,14"/></svg>;
    case 'database': return <svg {...p}><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4,5.5 V18.5 C4,20.2 7.6,21.5 12,21.5 C16.4,21.5 20,20.2 20,18.5 V5.5"/><path d="M4,12 C4,13.7 7.6,15 12,15 C16.4,15 20,13.7 20,12"/></svg>;
    case 'server': return <svg {...p}><rect x="3" y="3.5" width="18" height="6" rx="1.2"/><rect x="3" y="14.5" width="18" height="6" rx="1.2"/><circle cx="7" cy="6.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="7" cy="17.5" r="0.9" fill="currentColor" stroke="none"/></svg>;
    case 'zap': return <svg {...p}><polygon points="13,2 4,14 11,14 10,22 20,10 13,10"/></svg>;
    case 'browser': return <svg {...p}><rect x="3" y="4.5" width="18" height="15" rx="1.5"/><line x1="3" y1="9" x2="21" y2="9"/><circle cx="6.3" cy="6.7" r="0.6" fill="currentColor" stroke="none"/><circle cx="8.3" cy="6.7" r="0.6" fill="currentColor" stroke="none"/></svg>;
    case 'chart': return <svg {...p}><line x1="4" y1="21" x2="20" y2="21"/><rect x="5" y="13" width="3.2" height="8"/><rect x="10.4" y="8" width="3.2" height="13"/><rect x="15.8" y="4" width="3.2" height="17"/></svg>;
    case 'check': return <svg {...p}><circle cx="12" cy="12" r="9"/><polyline points="8,12.5 11,15.5 16,9"/></svg>;
    case 'cap': return <svg {...p}><polygon points="12,3 2,8.5 12,14 22,8.5"/><path d="M6.5,10.7 V16 C6.5,17.8 9,19.3 12,19.3 C15,19.3 17.5,17.8 17.5,16 V10.7"/></svg>;
    case 'ribbon': return <svg {...p}><circle cx="12" cy="8" r="5"/><path d="M9,12.3 L7,21.5 L12,18.7 L17,21.5 L15,12.3"/></svg>;
    case 'cart': return <svg {...p}><circle cx="9.5" cy="20.5" r="1"/><circle cx="18" cy="20.5" r="1"/><path d="M2,3 H5 L7.4,15.3 A2,2 0 0 0 9.4,17 H18 A2,2 0 0 0 20,15.4 L21.5,7 H6"/></svg>;
    case 'book': return <svg {...p}><path d="M3,5 C6,3.3 9.5,3.3 12,5 V20 C9.5,18.3 6,18.3 3,20 Z"/><path d="M21,5 C18,3.3 14.5,3.3 12,5 V20 C14.5,18.3 18,18.3 21,20 Z"/></svg>;
    case 'mail': return <svg {...p}><rect x="3" y="5" width="18" height="14" rx="1.5"/><polyline points="3.5,6 12,13 20.5,6"/></svg>;
    case 'phone': return <svg {...p}><path d="M6.5,3 h3 l1.5,4.5 L9,9.5 a12,12 0 0 0 5.5,5.5 l2,-2 L21,14.5 v3 a2,2 0 0 1 -2.2,2 A16,16 0 0 1 4.5,5.2 A2,2 0 0 1 6.5,3 Z"/></svg>;

    default: return null;

}

function App() {
  const [theme, setTheme] = useState(() => {
    try {
      return localStorage.getItem('portfolio-theme') || 'auto';
    } catch (e) { return 'auto'; }
  });
  const active = useActiveSection();

  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'dark') root.setAttribute('data-theme', 'dark');
    else if (theme === 'light') root.setAttribute('data-theme', 'light');
    else root.removeAttribute('data-theme');
    try { localStorage.setItem('portfolio-theme', theme); } catch (e) {}
  }, [theme]);

  const toggleTheme = () => {
    setTheme(prev => {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const currentlyDark = prev === 'dark' || (prev === 'auto' && prefersDark);
      return currentlyDark ? 'light' : 'dark';
    });
  };

  return (
    <div className="layout">
      <Sidebar active={active} theme={theme} toggleTheme={toggleTheme} />
      <main>
        <Overview />
        <Experience />
        <Projects />
        <Skills />
        <Education />
        <Contact />
      </main>
    </div>
  );
}
